{% extends "base.html" %}
{% block title %}Edit Expense{% endblock %}
{% block page_title %}Edit Expense{% endblock %}

{% block content %}
<div style="max-width:640px">
  <div class="section-header fade-up">
    <div>
      <div class="section-title">Edit Expense Entry</div>
      <div style="font-size:0.8rem;color:var(--muted);margin-top:3px">Update record #{{ expense.id }}</div>
    </div>
    <a href="{{ url_for('expenses') }}" class="btn btn-ghost">← Back</a>
  </div>
  <div class="card fade-up delay-1">
    <form method="POST" action="{{ url_for('edit_expense', id=expense.id) }}">
      <div class="grid-2">
        <div class="form-group">
          <label>Vendor</label>
          <input type="text" name="vendor" value="{{ expense.vendor or '' }}">
        </div>
        <div class="form-group">
          <label>Amount (₦) *</label>
          <input type="number" name="amount" value="{{ expense.amount }}" step="0.01" min="0" required>
        </div>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>Category</label>
          <select name="category">
            <option value="">Select category…</option>
            {% for cat in categories %}
            <option value="{{ cat }}" {% if expense.category == cat %}selected{% endif %}>{{ cat }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Date</label>
          <input type="date" name="date" value="{{ expense.date or '' }}">
        </div>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select name="status">
          <option value="">Select status…</option>
          {% for s in ['Paid','Pending'] %}
          <option value="{{ s }}" {% if expense.status == s %}selected{% endif %}>{{ s }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea name="description">{{ expense.description or '' }}</textarea>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <a href="{{ url_for('expenses') }}" class="btn btn-ghost">Cancel</a>
        <button type="submit" class="btn btn-primary">Update Expense</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
