{% extends "base.html" %}
{% block title %}Edit Employee{% endblock %}
{% block page_title %}Edit Employee{% endblock %}

{% block content %}
<div style="max-width:640px">
  <div class="section-header fade-up">
    <div>
      <div class="section-title">Edit Payroll Entry</div>
      <div style="font-size:0.8rem;color:var(--muted);margin-top:3px">Update record #{{ payroll.id }}</div>
    </div>
    <a href="{{ url_for('payroll') }}" class="btn btn-ghost">← Back</a>
  </div>
  <div class="card fade-up delay-1">
    <form method="POST" action="{{ url_for('edit_payroll', id=payroll.id) }}">
      <div class="grid-2">
        <div class="form-group">
          <label>Employee Name *</label>
          <input type="text" name="employee" value="{{ payroll.employee }}" required>
        </div>
        <div class="form-group">
          <label>Role *</label>
          <input type="text" name="role" value="{{ payroll.role }}" required>
        </div>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>Salary (₦) *</label>
          <input type="number" name="salary" value="{{ payroll.salary }}" step="0.01" min="0" required>
        </div>
        <div class="form-group">
          <label>Payment Date</label>
          <input type="date" name="payment_date" value="{{ payroll.payment_date or '' }}">
        </div>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select name="status">
          <option value="">Select status…</option>
          {% for s in ['Paid','Pending'] %}
          <option value="{{ s }}" {% if payroll.status == s %}selected{% endif %}>{{ s }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea name="notes">{{ payroll.notes or '' }}</textarea>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <a href="{{ url_for('payroll') }}" class="btn btn-ghost">Cancel</a>
        <button type="submit" class="btn btn-primary">Update Employee</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
