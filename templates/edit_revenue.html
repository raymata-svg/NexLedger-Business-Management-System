{% extends "base.html" %}
{% block title %}Edit Revenue{% endblock %}
{% block page_title %}Edit Revenue{% endblock %}

{% block content %}
<div style="max-width:640px">
  <div class="section-header fade-up">
    <div>
      <div class="section-title">Edit Revenue Entry</div>
      <div style="font-size:0.8rem;color:var(--muted);margin-top:3px">Update record #{{ revenue.id }}</div>
    </div>
    <a href="{{ url_for('revenue') }}" class="btn btn-ghost">← Back</a>
  </div>

  <div class="card fade-up delay-1">
    <form method="POST" action="{{ url_for('edit_revenue', id=revenue.id) }}">
      <div class="grid-2">
        <div class="form-group">
          <label>Title *</label>
          <input type="text" name="title" value="{{ revenue.title }}" required>
        </div>
        <div class="form-group">
          <label>Amount (₦) *</label>
          <input type="number" name="amount" value="{{ revenue.amount }}" step="0.01" min="0" required>
        </div>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>Client</label>
          <input type="text" name="client" value="{{ revenue.client or '' }}">
        </div>
        <div class="form-group">
          <label>Date</label>
          <input type="date" name="date" value="{{ revenue.date or '' }}">
        </div>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select name="status">
          <option value="">Select status…</option>
          {% for s in ['Paid','Pending','Overdue'] %}
          <option value="{{ s }}" {% if revenue.status == s %}selected{% endif %}>{{ s }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea name="description">{{ revenue.description or '' }}</textarea>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <a href="{{ url_for('revenue') }}" class="btn btn-ghost">Cancel</a>
        <button type="submit" class="btn btn-primary">Update Revenue</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
